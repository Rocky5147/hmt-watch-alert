
name: HMT Watch Stock Monitor

on:
  schedule:
    - cron: "2/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hmt-stock-monitor
  cancel-in-progress: false

jobs:
  check-stock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Check HMT stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Save stock history
        run: |
          git config user.name "HMT Stock Bot"
          git config user.email "hmt-stock-bot@users.noreply.github.com"

          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update HMT stock status"
            git push
          fi

